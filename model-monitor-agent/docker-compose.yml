services:

  prometheus:
    image: prom/prometheus:latest
    container_name: model-monitor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: model-monitor-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
